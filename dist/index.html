<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07162d">
  <meta name="description" content="Something is Coming.">
  <title>Something is Coming</title>
  <link rel="stylesheet" href="./styles.css"> 
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="countdown-panel" aria-labelledby="countdown-title">
      <h1 id="countdown-title" data-title>Something is Coming</h1>
      <div class="countdown" data-countdown role="timer" aria-label="Time remaining" aria-live="off">
        <div class="time-unit"><span class="time-value" data-days>--</span><span class="time-label">DAYS</span></div>
        <div class="time-unit"><span class="time-value" data-hours>--</span><span class="time-label">HOURS</span></div>
        <div class="time-unit"><span class="time-value" data-minutes>--</span><span class="time-label">MINUTES</span></div>
        <div class="time-unit"><span class="time-value" data-seconds>--</span><span class="time-label">SECONDS</span></div>
      </div>
    </section>
  </main>
</body>
</html>
